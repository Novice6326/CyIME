name: Build and Test APK

on:
  push:
    branches:
      - main
      - dev*
  pull_request:
  workflow_dispatch:

concurrency:
  group: cyime-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK and native build tools
        run: |
          sdkmanager "ndk;29.0.14206865"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Run unit tests with diagnostic output
        timeout-minutes: 25
        run: ./gradlew :app:testDebugUnitTest :plugin-core:testDebugUnitTest --stacktrace --info --console=plain --build-cache --parallel

      - name: Generate Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/testDebugUnitTest/*.xml'
          fail_on_failure: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            plugin-core/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  build-apk:
    name: Build ARM64 APK and plugins
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK and native build tools
        run: |
          sdkmanager "ndk;29.0.14206865"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --build-cache --console=plain

      - name: Setup signing keystore
        run: |
          cat > app/keystore.properties <<'EOF'
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF


      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Build offline translation native libraries
        run: |
          bash tools/offline_translate/build-android.sh
          echo "CYIME_TRANSLATE_LIB_SHA256_ARM64=$(sha256sum tools/offline_translate/work/out/arm64-v8a/libcytranslate.so | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "CYIME_TRANSLATE_LIB_SHA256_X86_64=$(sha256sum tools/offline_translate/work/out/x86_64/libcytranslate.so | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Build Full ARM64 Signed Release APK
        run: ./gradlew assembleRelease -PbundleModels=true -Parm64Only=true -PpythonExecutable=python3 -Pcyime.translateLibDir=tools/offline_translate/work/out --stacktrace --info --console=plain --build-cache --parallel

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/release/CyIME-*.apk; do
            OUT=$("$APKSIGNER" verify --verbose --min-sdk-version 23 --print-certs "$apk")
            echo "$OUT" | grep -q 'Verified using v1 scheme (JAR signing): true'
            echo "$OUT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
            echo "Verified: $apk"
          done

      - name: Build Plugin XIPKs
        run: bash scripts/build-plugins.sh

      - name: Upload Full ARM64 APK and plugins
        uses: actions/upload-artifact@v7
        with:
          name: full-arm64-apk
          path: |
            app/build/outputs/apk/release/*.apk
            build/plugin-release/*.xipk
          if-no-files-found: error
          retention-days: 7
